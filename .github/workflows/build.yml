name: Build AVETemporalPoC IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project AVETemporalPoC.xcodeproj \
            -scheme AVETemporalPoC \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/AVETemporalPoC.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry AVETemporalPoC.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AVETemporalPoC-IPA
          path: AVETemporalPoC.ipa
          if-no-files-found: error
